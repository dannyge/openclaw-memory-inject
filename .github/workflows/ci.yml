name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 20 is EOL (Apr 2026) and unsupported by OpenClaw (requires 22.19+).
        # 22 = OpenClaw's minimum; 24 = OpenClaw's recommended default.
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (src + test)
        run: npm run typecheck

      - name: Version consistency
        run: npm run version-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package-check:
    name: Verify npm tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Dry-run publish
        run: npm publish --dry-run
